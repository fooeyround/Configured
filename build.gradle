plugins {
	id 'fabric-loom' version '1.11-SNAPSHOT'
	id 'maven-publish'
}

version = ""
group = project.maven_group

String versionSuffix = ''

if (System.getenv("BUILD_RELEASE") != "true") {
	String buildNumber = System.getenv("BUILD_ID")
	versionSuffix += buildNumber != null ? ('+build.' + buildNumber) : '-SNAPSHOT'
}
String fullModVersion = project.mod_version + versionSuffix

base {
	archivesName = project.archives_base_name + '-mc' + project.minecraft_version + "-v" + fullModVersion
}

repositories {
	maven {
		url 'https://jitpack.io'
	}
	maven {
		url 'https://www.cursemaven.com'
	}

	maven {
		url 'https://maven.xpple.dev/maven2'
	}
}

loom {
	splitEnvironmentSourceSets()

	runConfigs.configureEach {
		ideConfigGenerated = true
		vmArgs '-Dmixin.debug.export=true'
	}

	mods {
		"configured" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}





dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation(include("dev.xpple:betterconfig-fabric:${project.betterconfig_version}"))

}

processResources {
	inputs.property "version", fullModVersion
	inputs.property "minecraft_dependency", project.minecraft_version

	filesMatching("fabric.mod.json") {
		def valueMap = [
				"version": fullModVersion,
				"minecraft_dependency": project.minecraft_version,
				"fabric_loader_dependency": project.loader_version,
		]
		expand valueMap
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}